name: Playable tempo validation
on:
  push:
    branches: [u13-playable-tempo-validation]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import project
        run: /tmp/godot/Godot* --headless --editor --path . --quit
      - name: Focused native tests
        run: |
          for runner in U13PlayableBoardTestRunner U13GameStagingTestRunner; do
            /tmp/godot/Godot* --headless --path . --script "Scripts/Sim/$runner.gd"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-4.7.2-linux-verified
          path: /tmp/godot.zip
