name: Playable tempo validation
on:
  push:
    branches: [u13-basic-doctrine, u13-playable-tempo-validation, u13-playable-tempo-ready]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum --check
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
      - name: Import project
        run: /tmp/godot/Godot* --headless --editor --path . --quit
      - name: Python rule and bot contracts
        env:
          PYTHONPATH: Scripts/Sim
        run: python -m unittest u13_doctrine.test_split_ward u13_doctrine.test_ward_recipes u13_doctrine.test_diagnostics test_u13_ward_runner -q
      - name: Native rules, playable controls and paired parity
        run: python Scripts/Sim/check_u13_playable_tempo.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
