name: Wilhelm isolated build inputs
on:
  push:
    branches: [work/wilhelm-audio-20260928]
    paths: [.github/workflows/wilhelm-build-transfer.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24b654862d97ac05af937d575fecbd67baf32fa5
          fetch-depth: 1
      - name: Package pinned source and original recording
        run: |
          mkdir -p /tmp/wilhelm-build
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, wave, json
          root = Path.cwd()
          selected = {'.gd', '.py', '.godot', '.tscn', '.tres', '.uid', '.md', '.sh', '.yml', '.cfg'}
          original = root / 'Sounds/SourceRecordings/Originals/Wilhelm.wav'
          with zipfile.ZipFile('/tmp/wilhelm-build/source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and '.git' not in p.parts and (p.suffix in selected or p == original):
                      z.write(p, p.relative_to(root))
          with wave.open(str(original), 'rb') as w:
              print(json.dumps({'channels': w.getnchannels(), 'sample_width': w.getsampwidth(), 'sample_rate': w.getframerate(), 'frames': w.getnframes(), 'seconds': w.getnframes()/w.getframerate(), 'sha256': hashlib.sha256(original.read_bytes()).hexdigest()}))
          PY
      - name: Fetch pinned Godot test runtime
        run: |
          curl --fail --location --retry 2 -o /tmp/wilhelm-build/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/wilhelm-build/godot.zip' | sha256sum --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wilhelm-build-inputs-24b6548
          path: /tmp/wilhelm-build/
          retention-days: 3
